name: Scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "web/win"
      - ".github/workflows/scripts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "web/win"
      - ".github/workflows/scripts.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh scripts/*/pair.sh scripts/test.sh

  sh:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, shell: dash }
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: sh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test.sh ${{ matrix.shell }}

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell 5.1 is what `irm … | iex` runs in on a stock PC.
      - name: Pester
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester -Path scripts -CI
