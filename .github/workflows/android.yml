name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  # Builds a signed APK without publishing it, to check signing before a tag.
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lint testDebugUnitTest

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version and release notes
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          for lang in en-US fr-FR; do
            if [ ! -s "../fastlane/metadata/android/$lang/changelogs/$code.txt" ]; then
              echo "::error::Missing fastlane/metadata/android/$lang/changelogs/$code.txt"
              exit 1
            fi
          done
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Decode keystore
        env:
          DEBOUT_KEYSTORE_BASE64: ${{ secrets.DEBOUT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBOUT_KEYSTORE_BASE64" ]; then
            echo "::error::The DEBOUT_KEYSTORE_BASE64 secret is not set: see Releases in the README"
            exit 1
          fi
          echo "$DEBOUT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          DEBOUT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DEBOUT_KEYSTORE_PASSWORD: ${{ secrets.DEBOUT_KEYSTORE_PASSWORD }}
          DEBOUT_KEY_ALIAS: ${{ secrets.DEBOUT_KEY_ALIAS }}
          DEBOUT_KEY_PASSWORD: ${{ secrets.DEBOUT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/debout-v${VERSION_NAME}.apk"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debout-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/debout-*.apk
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/debout-*.apk
          body_path: fastlane/metadata/android/en-US/changelogs/${{ env.VERSION_CODE }}.txt
