name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]

defaults:
  run:
    working-directory: android

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lint testDebugUnitTest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.DEBOUT_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          DEBOUT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DEBOUT_KEYSTORE_PASSWORD: ${{ secrets.DEBOUT_KEYSTORE_PASSWORD }}
          DEBOUT_KEY_ALIAS: ${{ secrets.DEBOUT_KEY_ALIAS }}
          DEBOUT_KEY_PASSWORD: ${{ secrets.DEBOUT_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/debout-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/debout-*.apk
          generate_release_notes: true
