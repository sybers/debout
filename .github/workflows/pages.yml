name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          cp -r web _site
          rsync -a --exclude '*.Tests.ps1' --exclude '*.test.sh' --exclude tests --exclude test.sh scripts/ _site/scripts/
          cp scripts/macos/pair.sh _site/mac
          cp scripts/linux/pair.sh _site/linux
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
